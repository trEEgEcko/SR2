name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: unzip -q SR2-Phase1.zip
      - run: chmod +x SR2-Phase1/gradlew
      - run: cd SR2-Phase1 && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SegaRally2-apk
          path: SR2-Phase1/app/build/outputs/apk/release/*.apk
