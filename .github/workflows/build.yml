name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Locate project
        run: |
          Z=$(find . -iname 'SR2-Phase1*.zip' | head -1)
          if [ -n "$Z" ]; then
            unzip -q -o "$Z" -d /tmp/p
            echo "PROJ=/tmp/p/SR2-Phase1" >> $GITHUB_ENV
          elif [ -f gradlew ]; then
            echo "PROJ=$PWD" >> $GITHUB_ENV
          else
            ls -R | head -50; exit 1
          fi
      - run: chmod +x "$PROJ/gradlew"
      - run: cd "$PROJ" && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SegaRally2-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
